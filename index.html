<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CANTARA</title>
    <link href="css/main.css" rel="stylesheet" />
    <link rel="shortcut icon" href="imgs/icon.png">
</head>
<body>
    <header>
        <img src="imgs/logoeurosup.png" >
        <h3>CANTARA <br>CALCULADORA DE PESO NETOS SOBRE CANASTAS</h3>
    </header>
    <main>
        <form id="calculation-form">
            <label for="taracanasta">Tara de Canasta:</label>
            <select id="taracanasta" name="taracanasta" required>
                <option value="1.8">1.8</option>
                <option value="2.0">2.0</option>
            </select>
            <label for="numcanastas">Número de Canastas:</label>
            <input type="number" step="any" id="numcanastas" name="numcanastas" required>
            
            <label for="pesobruto">Peso Bruto:</label>
            <input type="number" step="any" id="pesobruto" name="pesobruto" required>
            <button type="submit">Calcular</button>
        </form>
        <div id="resultado"></div>
                <!-- Botón Flotante de WhatsApp -->
<div id="whatsapp-btn" class="wpp-flotante">
  <svg xmlns="http://w3.org" viewBox="0 0 448 512" class="wpp-icono">
    <path fill="#FFF" d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
  </svg>
</div>

<!-- Estilos CSS -->
<style>
  .wpp-flotante {
    position: fixed;
    width: 60px;
    height: 60px;
    bottom: 20px;
    right: 20px;
    background-color: #25d366;
    color: #fff;
    border-radius: 50px;
    text-align: center;
    font-size: 30px;
    box-shadow: 2px 2px 3px #999;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .wpp-flotante:hover {
    transform: scale(1.1);
    background-color: #128c7e;
  }

  .wpp-icono {
    width: 35px;
    height: 35px;
  }
</style>

<!-- Lógica JavaScript -->
<script>
  document.getElementById('whatsapp-btn').addEventListener('click', function() {
    // Tu número con el código de país de Colombia (+57)
    const telefono = "573197608164"; 
    
    // Mensaje opcional que aparecerá en el chat del cliente
    const mensaje = encodeURIComponent("¡Hola! Me interesa obtener más información sobre los Sistemas de Alarmas Jaguar.");
    
    // Enlace de la API de WhatsApp
    const url = `https://wa.me/${telefono}?text=${mensaje}`;
    
    // Abre la conversación en una pestaña nueva
    window.open(url, '_blank');
  });
</script>
        
    </main>
    <script src="js/main.js"></script>
</body>
</html>
